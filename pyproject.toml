[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skid-steer-rl-lab"
version = "0.1.0"
description = "A small, reproducible MuJoCo skid-steer parking experiment"
requires-python = ">=3.11"
dependencies = ["mujoco", "gymnasium", "stable-baselines3", "imageio", "imageio-ffmpeg"]

[tool.setuptools.package-data]
skid_steer_rl = ["*.xml"]

[tool.ruff]
line-length = 88

[tool.setuptools.packages.find]
include = ["skid_steer_rl*"]
